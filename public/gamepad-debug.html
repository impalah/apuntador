<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamepad Debug - Apuntador</title>
    <style>
      body {
        font-family: monospace;
        background: #000;
        color: #0f0;
        padding: 20px;
        margin: 0;
      }
      .log {
        background: #111;
        border: 1px solid #333;
        padding: 10px;
        height: 300px;
        overflow-y: auto;
        margin-bottom: 20px;
      }
      .info {
        background: #222;
        padding: 10px;
        margin-bottom: 10px;
        border-left: 4px solid #0f0;
      }
      button {
        background: #333;
        color: #0f0;
        border: 1px solid #555;
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
      }
      button:hover {
        background: #444;
      }
      .error {
        color: #f00;
      }
      .warning {
        color: #ff0;
      }
      .success {
        color: #0f0;
      }
    </style>
  </head>
  <body>
    <h1>🎮 Gamepad Debug - Apuntador</h1>

    <div class="info">
      <strong>Status:</strong> <span id="status">Initializing...</span><br />
      <strong>Connected Gamepads:</strong> <span id="gamepadCount">0</span><br />
      <strong>Listening:</strong> <span id="listening">No</span>
    </div>

    <div>
      <button onclick="startTesting()">Start Testing</button>
      <button onclick="stopTesting()">Stop Testing</button>
      <button onclick="clearLog()">Clear Log</button>
      <button onclick="testAction()">Test Action</button>
    </div>

    <h2>📋 Event Log</h2>
    <div class="log" id="log"></div>

    <h2>🎯 Test Gamepad Manager</h2>
    <div class="info">
      <p>This will test the actual gamepad manager used by Apuntador.</p>
      <button onclick="testGamepadManager()">Initialize Gamepad Manager</button>
      <button onclick="assignTestButton()">Assign Button to Test Action</button>
    </div>

    <script>
      let isTestingActive = false
      let connectedGamepads = []

      function log(message, type = 'info') {
        const logElement = document.getElementById('log')
        const timestamp = new Date().toLocaleTimeString()
        const className =
          type === 'error'
            ? 'error'
            : type === 'warning'
              ? 'warning'
              : type === 'success'
                ? 'success'
                : ''
        logElement.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`
        logElement.scrollTop = logElement.scrollHeight
      }

      function updateGamepadStatus() {
        if ('getGamepads' in navigator) {
          const gamepads = navigator.getGamepads()
          connectedGamepads = Array.from(gamepads).filter(Boolean)
          document.getElementById('status').textContent = 'Supported'
          document.getElementById('gamepadCount').textContent = connectedGamepads.length
        } else {
          document.getElementById('status').textContent = 'Not Supported'
          document.getElementById('gamepadCount').textContent = '0'
        }
        document.getElementById('listening').textContent = isTestingActive ? 'Yes' : 'No'
      }

      let animationId = null
      const lastGamepadState = new Map()

      function pollGamepads() {
        if (!isTestingActive) return

        updateGamepadStatus()

        connectedGamepads.forEach((gamepad) => {
          if (!gamepad) return

          const gamepadIndex = gamepad.index
          const prevState = lastGamepadState.get(gamepadIndex) || { buttons: [], axes: [] }

          // Check all buttons
          for (let buttonIndex = 0; buttonIndex < gamepad.buttons.length; buttonIndex++) {
            const button = gamepad.buttons[buttonIndex]
            const wasPressed = prevState.buttons[buttonIndex] || false
            const isPressed = button.pressed

            if (!wasPressed && isPressed) {
              const buttonNames = {
                0: 'A/X Button',
                1: 'B/Circle Button',
                2: 'X/Square Button',
                3: 'Y/Triangle Button',
                4: 'Left Bumper',
                5: 'Right Bumper',
                6: 'Left Trigger',
                7: 'Right Trigger',
                8: 'Select/Share',
                9: 'Start/Options',
                10: 'Left Stick Click',
                11: 'Right Stick Click',
                12: 'D-pad Up',
                13: 'D-pad Down',
                14: 'D-pad Left',
                15: 'D-pad Right',
                16: 'Home/PS Button',
              }
              const buttonName = buttonNames[buttonIndex] || `Button ${buttonIndex}`
              log(
                `🎮 Button Press: ${buttonName} (Index: ${buttonIndex}) on Gamepad ${gamepadIndex}`,
                'success'
              )
            }
          }

          // Check all axes (Activity Sensor, sticks, triggers)
          for (let axisIndex = 0; axisIndex < gamepad.axes.length; axisIndex++) {
            const axisValue = gamepad.axes[axisIndex]
            const prevAxisValue = prevState.axes ? prevState.axes[axisIndex] : 0

            // Special handling for Activity Sensor (Axis 9)
            if (axisIndex === 9) {
              // Ignore small changes and the "rest" value (3.29)
              const isRestValue = Math.abs(axisValue - 3.29) < 0.1
              const wasRestValue = Math.abs(prevAxisValue - 3.29) < 0.1
              const significantChange = Math.abs(axisValue - prevAxisValue) > 0.1

              if (significantChange) {
                if (isRestValue) {
                  log(
                    `📊 Activity Sensor: ${axisValue.toFixed(2)} (released) (gamepad #${gamepadIndex})`,
                    'warning'
                  )
                } else if (wasRestValue) {
                  // Button press detected
                  let buttonName = 'Unknown'
                  const roundedValue = Math.round(axisValue * 100) / 100

                  if (Math.abs(roundedValue - 0.71) < 0.05) buttonName = 'Button 1'
                  else if (Math.abs(roundedValue - -1.0) < 0.05) buttonName = 'Button 2'
                  else if (Math.abs(roundedValue - -0.43) < 0.05) buttonName = 'Button 3'
                  else if (Math.abs(roundedValue - 0.14) < 0.05) buttonName = 'Button 4'

                  log(
                    `🎮 Activity Sensor ${buttonName}: ${axisValue.toFixed(2)} (PRESS DETECTED) (gamepad #${gamepadIndex})`,
                    'success'
                  )
                } else {
                  log(
                    `📊 Activity Sensor: ${axisValue.toFixed(2)} (active) (gamepad #${gamepadIndex})`
                  )
                }
              }
            } else {
              // Standard axis logging for other axes
              if (Math.abs(axisValue - prevAxisValue) > 0.1) {
                const axisNames = {
                  0: 'Left Stick X',
                  1: 'Left Stick Y',
                  2: 'Right Stick X',
                  3: 'Right Stick Y',
                  4: 'Activity Sensor',
                  5: 'Axis 5',
                  6: 'Axis 6',
                  7: 'Axis 7',
                  8: 'Axis 8',
                }
                const axisName = axisNames[axisIndex] || `Axis ${axisIndex}`
                const status = Math.abs(axisValue) > 0.1 ? 'active' : 'neutral'

                log(
                  `📊 ${axisName}: ${axisValue.toFixed(2)} (${status}) (gamepad #${gamepadIndex})`,
                  Math.abs(axisValue) > 0.5 ? 'success' : 'info'
                )
              }
            }
          }

          // Update state
          lastGamepadState.set(gamepadIndex, {
            buttons: gamepad.buttons.map((btn) => btn.pressed),
            axes: [...gamepad.axes],
          })
        })

        animationId = requestAnimationFrame(pollGamepads)
      }

      window.startTesting = function () {
        log('🚀 Starting gamepad testing...', 'success')

        if (!('getGamepads' in navigator)) {
          log('❌ Gamepad API not supported!', 'error')
          return
        }

        isTestingActive = true
        pollGamepads()
        updateGamepadStatus()
        log('🔊 Listening for gamepad events...')
      }

      window.stopTesting = function () {
        isTestingActive = false
        if (animationId) {
          cancelAnimationFrame(animationId)
          animationId = null
        }
        updateGamepadStatus()
        log('⏹️ Stopped listening for gamepad events', 'warning')
      }

      window.clearLog = function () {
        document.getElementById('log').innerHTML = ''
      }

      window.testAction = function () {
        log('🧪 Testing action execution...')
        alert('Test action executed! This simulates a teleprompter action.')
      }

      window.testGamepadManager = function () {
        log('🎯 Testing Gamepad Manager...', 'success')
        log('Go to the main Apuntador page and test gamepad there')
        window.open('/', '_blank')
      }

      window.assignTestButton = function () {
        log('🔗 This feature requires the main Apuntador app...', 'warning')
        log('Go to Settings > Gamepad tab to assign buttons')
      }

      // Listen for gamepad connect/disconnect
      window.addEventListener('gamepadconnected', (e) => {
        log(`🔌 Gamepad connected: ${e.gamepad.id}`, 'success')
        updateGamepadStatus()
      })

      window.addEventListener('gamepaddisconnected', (e) => {
        log(`🔌 Gamepad disconnected: ${e.gamepad.id}`, 'warning')
        updateGamepadStatus()
      })

      // Initialize
      log('🎮 Gamepad Debug Tool Loaded')
      log('Click "Start Testing" to begin monitoring gamepad events')
      updateGamepadStatus()

      // Update status periodically
      setInterval(updateGamepadStatus, 1000)
    </script>
  </body>
</html>
