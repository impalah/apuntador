name: Build Linux Desktop

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - debug
          - info
          - warning
          - error
      release_tag:
        description: 'Release tag to build from (e.g., 0.1.24)'
        required: true
        type: string
      buildType:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      generatePackages:
        description: 'Generate DEB, RPM, and AppImage packages'
        required: false
        default: true
        type: boolean
      buildTarget:
        description: 'Linux build target'
        required: true
        default: 'x86_64-unknown-linux-gnu'
        type: choice
        options:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
      environment:
        description: 'Environment to deploy (only for release builds)'
        required: true
        type: choice
        options:
          - dev
          - pre
          - pro
        default: 'dev'

env:
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm
  RUST_BACKTRACE: 1

jobs:
  build-linux-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.buildType == 'release' && inputs.buildTarget == 'x86_64-unknown-linux-gnu' && inputs.generatePackages == true && inputs.environment || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update

          # First, remove any conflicting packages if they exist
          sudo apt-get remove -y libappindicator3-dev || true

          # Install dependencies with proper conflict resolution
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.buildTarget }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: ${{ runner.os }}-rust-${{ inputs.buildTarget }}-${{ inputs.buildType }}

      - name: Install npm dependencies
        run: npm ci

      - name: Verify environment
        run: |
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Rust version: $(rustc --version)"
          echo "Build target: ${{ inputs.buildTarget }}"
          echo "Build type: ${{ inputs.buildType }}"
          echo "Generate packages: ${{ inputs.generatePackages }}"

      - name: Build Tauri application
        run: |
          if [ "${{ inputs.buildType }}" = "debug" ]; then
            npm run tauri:build -- --target ${{ inputs.buildTarget }} --debug
          else
            if [ "${{ inputs.buildTarget }}" = "x86_64-unknown-linux-gnu" ]; then
              npm run tauri:build:linux
            else
              npm run tauri:build -- --target ${{ inputs.buildTarget }}
            fi
          fi
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: List build outputs
        run: |
          echo "=== Build outputs ==="
          find src-tauri/target -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "apuntador" | head -20
          echo "====================="

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts

          # Find the target directory
          if [ "${{ inputs.buildType }}" = "debug" ]; then
            TARGET_DIR="src-tauri/target/${{ inputs.buildTarget }}/debug"
            BUNDLE_DIR="$TARGET_DIR/bundle"
          else
            TARGET_DIR="src-tauri/target/${{ inputs.buildTarget }}/release"
            BUNDLE_DIR="$TARGET_DIR/bundle"
          fi

          echo "Looking for artifacts in: $TARGET_DIR"
          echo "Bundle directory: $BUNDLE_DIR"

          # Copy binary
          if [ -f "$TARGET_DIR/apuntador" ]; then
            cp "$TARGET_DIR/apuntador" artifacts/apuntador-linux-${{ inputs.buildTarget }}
            echo "✅ Copied binary"
          else
            echo "❌ Binary not found at $TARGET_DIR/apuntador"
          fi

          # Copy packages if they exist
          if [ "${{ inputs.generatePackages }}" = "true" ]; then
            # DEB package
            if find "$BUNDLE_DIR" -name "*.deb" | head -1; then
              find "$BUNDLE_DIR" -name "*.deb" -exec cp {} artifacts/ \;
              echo "✅ Copied DEB package"
            else
              echo "⚠️ DEB package not found"
            fi
            
            # RPM package
            if find "$BUNDLE_DIR" -name "*.rpm" | head -1; then
              find "$BUNDLE_DIR" -name "*.rpm" -exec cp {} artifacts/ \;
              echo "✅ Copied RPM package"
            else
              echo "⚠️ RPM package not found"
            fi
            
            # AppImage
            if find "$BUNDLE_DIR" -name "*.AppImage" | head -1; then
              find "$BUNDLE_DIR" -name "*.AppImage" -exec cp {} artifacts/ \;
              echo "✅ Copied AppImage"
            else
              echo "⚠️ AppImage not found"
            fi
          fi

          # List what we have
          echo "=== Artifacts prepared ==="
          ls -la artifacts/
          echo "=========================="

      - name: Generate checksums
        run: |
          cd artifacts
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> checksums.txt
            fi
          done
          echo "=== Checksums ==="
          cat checksums.txt
          echo "=================="

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apuntador-linux-${{ inputs.buildTarget }}-${{ inputs.buildType }}-${{ inputs.release_tag }}
          path: artifacts/
          if-no-files-found: error

      - name: Display build summary
        run: |
          echo "## 🐧 Linux Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Target: \`${{ inputs.buildTarget }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Type: \`${{ inputs.buildType }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Packages: \`${{ inputs.generatePackages }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ inputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated Files:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -la artifacts/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Checksums:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat artifacts/checksums.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # Upload to apuntador.io S3 bucket (only for release x86_64 builds with packages)
      - name: Configure AWS credentials for apuntador.io
        if: ${{ inputs.buildType == 'release' && inputs.buildTarget == 'x86_64-unknown-linux-gnu' && inputs.generatePackages == true }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.APUNTADOR_IO_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.APUNTADOR_IO_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.APUNTADOR_IO_AWS_REGION }}

      - name: Find and rename Linux packages
        if: ${{ inputs.buildType == 'release' && inputs.buildTarget == 'x86_64-unknown-linux-gnu' && inputs.generatePackages == true }}
        env:
          VERSION: ${{ inputs.release_tag }}
        run: |
          cd artifacts
          
          # Find and rename packages with consistent naming
          DEB_FILE=$(ls *.deb 2>/dev/null | head -1)
          RPM_FILE=$(ls *.rpm 2>/dev/null | head -1)
          APPIMAGE_FILE=$(ls *.AppImage 2>/dev/null | head -1)
          
          if [ -n "$DEB_FILE" ]; then
            NEW_DEB="Apuntador_${VERSION}_amd64.deb"
            mv "$DEB_FILE" "$NEW_DEB"
            echo "DEB_FILENAME=$NEW_DEB" >> $GITHUB_ENV
            echo "✅ Renamed DEB: $NEW_DEB"
          fi
          
          if [ -n "$RPM_FILE" ]; then
            NEW_RPM="Apuntador-${VERSION}-1.x86_64.rpm"
            mv "$RPM_FILE" "$NEW_RPM"
            echo "RPM_FILENAME=$NEW_RPM" >> $GITHUB_ENV
            echo "✅ Renamed RPM: $NEW_RPM"
          fi
          
          if [ -n "$APPIMAGE_FILE" ]; then
            NEW_APPIMAGE="Apuntador_${VERSION}_amd64.AppImage"
            mv "$APPIMAGE_FILE" "$NEW_APPIMAGE"
            echo "APPIMAGE_FILENAME=$NEW_APPIMAGE" >> $GITHUB_ENV
            echo "✅ Renamed AppImage: $NEW_APPIMAGE"
          fi
          
          ls -la

      - name: Upload Linux packages to apuntador.io S3
        if: ${{ inputs.buildType == 'release' && inputs.buildTarget == 'x86_64-unknown-linux-gnu' && inputs.generatePackages == true }}
        env:
          S3_BUCKET: ${{ vars.APUNTADOR_IO_S3_BUCKET }}
          VERSION: ${{ inputs.release_tag }}
        run: |
          cd artifacts
          
          echo "⬆️  Uploading Linux packages to apuntador.io..."
          
          # Upload DEB
          if [ -n "$DEB_FILENAME" ] && [ -f "$DEB_FILENAME" ]; then
            echo "   Uploading DEB: $DEB_FILENAME"
            aws s3 cp "$DEB_FILENAME" "s3://${S3_BUCKET}/downloads/${DEB_FILENAME}" \
              --acl public-read \
              --metadata "version=${VERSION},type=linux-deb,uploaded=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "✅ DEB uploaded"
          fi
          
          # Upload RPM
          if [ -n "$RPM_FILENAME" ] && [ -f "$RPM_FILENAME" ]; then
            echo "   Uploading RPM: $RPM_FILENAME"
            aws s3 cp "$RPM_FILENAME" "s3://${S3_BUCKET}/downloads/${RPM_FILENAME}" \
              --acl public-read \
              --metadata "version=${VERSION},type=linux-rpm,uploaded=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "✅ RPM uploaded"
          fi
          
          # Upload AppImage
          if [ -n "$APPIMAGE_FILENAME" ] && [ -f "$APPIMAGE_FILENAME" ]; then
            echo "   Uploading AppImage: $APPIMAGE_FILENAME"
            aws s3 cp "$APPIMAGE_FILENAME" "s3://${S3_BUCKET}/downloads/${APPIMAGE_FILENAME}" \
              --acl public-read \
              --metadata "version=${VERSION},type=linux-appimage,uploaded=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "✅ AppImage uploaded"
          fi

      - name: Update versions.json for Linux packages
        if: ${{ inputs.buildType == 'release' && inputs.buildTarget == 'x86_64-unknown-linux-gnu' && inputs.generatePackages == true }}
        env:
          S3_BUCKET: ${{ vars.APUNTADOR_IO_S3_BUCKET }}
        run: |
          echo "⬇️  Downloading current versions.json..."
          if aws s3 cp "s3://${S3_BUCKET}/downloads/versions.json" versions.json 2>/dev/null; then
            echo "✅ Downloaded existing versions.json"
          else
            echo "⚠️  versions.json not found, creating new one"
            echo '{}' > versions.json
          fi
          
          echo "📝 Updating versions.json with Linux packages..."
          
          # Update all three Linux package types
          jq_updated=false
          if [ -n "$DEB_FILENAME" ]; then
            jq --arg filename "$DEB_FILENAME" '.["linux-deb"] = $filename' versions.json > versions.json.tmp
            mv versions.json.tmp versions.json
            jq_updated=true
          fi
          
          if [ -n "$RPM_FILENAME" ]; then
            jq --arg filename "$RPM_FILENAME" '.["linux-rpm"] = $filename' versions.json > versions.json.tmp
            mv versions.json.tmp versions.json
            jq_updated=true
          fi
          
          if [ -n "$APPIMAGE_FILENAME" ]; then
            jq --arg filename "$APPIMAGE_FILENAME" '.["linux-appimage"] = $filename' versions.json > versions.json.tmp
            mv versions.json.tmp versions.json
            jq_updated=true
          fi
          
          if [ "$jq_updated" = true ]; then
            echo "✅ Updated versions.json:"
            cat versions.json
            
            echo "⬆️  Uploading updated versions.json..."
            aws s3 cp versions.json "s3://${S3_BUCKET}/downloads/versions.json" \
              --acl public-read \
              --content-type "application/json" \
              --metadata "last-updated=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            
            echo "✅ versions.json updated successfully"
            echo "📍 Public URL: https://${S3_BUCKET}.s3.amazonaws.com/downloads/versions.json"
          else
            echo "⚠️  No Linux packages to update in versions.json"
          fi

  # Job for ARM64 build (if needed)
  build-linux-arm64:
    runs-on: ubuntu-latest
    if: inputs.buildTarget == 'aarch64-unknown-linux-gnu'
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Setup cross-compilation
        run: |
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo "linker = \"aarch64-linux-gnu-gcc\"" >> ~/.cargo/config.toml

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: ${{ runner.os }}-rust-arm64-${{ inputs.buildType }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build ARM64 Tauri application
        run: |
          if [ "${{ inputs.buildType }}" = "debug" ]; then
            npm run tauri:build -- --target aarch64-unknown-linux-gnu --debug
          else
            npm run tauri:build -- --target aarch64-unknown-linux-gnu
          fi
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu/
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Prepare ARM64 artifacts
        run: |
          mkdir -p artifacts-arm64

          if [ "${{ inputs.buildType }}" = "debug" ]; then
            TARGET_DIR="src-tauri/target/aarch64-unknown-linux-gnu/debug"
            BUNDLE_DIR="$TARGET_DIR/bundle"
          else
            TARGET_DIR="src-tauri/target/aarch64-unknown-linux-gnu/release"
            BUNDLE_DIR="$TARGET_DIR/bundle"
          fi

          # Copy binary
          if [ -f "$TARGET_DIR/apuntador" ]; then
            cp "$TARGET_DIR/apuntador" artifacts-arm64/apuntador-linux-arm64
          fi

          # Copy packages
          find "$BUNDLE_DIR" -name "*.deb" -exec cp {} artifacts-arm64/ \; 2>/dev/null || true
          find "$BUNDLE_DIR" -name "*.rpm" -exec cp {} artifacts-arm64/ \; 2>/dev/null || true
          find "$BUNDLE_DIR" -name "*.AppImage" -exec cp {} artifacts-arm64/ \; 2>/dev/null || true

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apuntador-linux-arm64-${{ inputs.buildType }}-${{ inputs.release_tag }}
          path: artifacts-arm64/
          if-no-files-found: warn
