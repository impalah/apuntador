name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      buildType:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache NPM packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Setup Android environment
        run: |
          # Create Android directory structure if needed
          mkdir -p android/app

      - name: Decode and create keystore
        if: ${{ github.event.inputs.buildType == 'release' || github.ref_type == 'tag' || github.ref == 'refs/heads/main' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/apuntador-release-key.keystore
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=apuntador-release-key.keystore" >> android/key.properties

      - name: Prepare Android project
        run: |
          npx cap copy android
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        if: ${{ github.event.inputs.buildType == 'release' || github.ref_type == 'tag' || github.ref == 'refs/heads/main' }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Debug APK
        if: ${{ github.event.inputs.buildType == 'debug' }}
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Rename APK files
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/apuntador-${{ steps.version.outputs.version }}-release.apk
          fi
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/apuntador-${{ steps.version.outputs.version }}-debug.apk
          fi

      - name: Upload Release APK artifact
        if: ${{ github.event.inputs.buildType == 'release' || github.ref_type == 'tag' || github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: apuntador-android-release-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/apuntador-${{ steps.version.outputs.version }}-release.apk
          if-no-files-found: error

      - name: Upload Debug APK artifact
        if: ${{ github.event.inputs.buildType == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: apuntador-android-debug-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/debug/apuntador-${{ steps.version.outputs.version }}-debug.apk
          if-no-files-found: error

      - name: Create Release (for tags)
        if: ${{ github.ref_type == 'tag' }}
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Apuntador v${{ steps.version.outputs.version }}
          body: |
            ## Apuntador v${{ steps.version.outputs.version }}

            ### Android APK
            - ✅ Signed release APK ready for installation
            - 📱 Compatible with Android API 23+ (Android 6.0+)
            - 🎯 Optimized for teleprompter usage

            ### Features
            - Mobile-first responsive design
            - Auto-scrolling with adjustable speed
            - Highlight band for current line focus
            - Mirror modes (horizontal/vertical)
            - Touch and keyboard controls
            - Markdown support
            - Dark/Light themes

            ### Installation
            1. Download the APK file
            2. Enable "Unknown sources" in Android settings
            3. Install the APK
            4. Grant necessary permissions

            ### Changes
            See commit history for detailed changes in this release.
          draft: false
          prerelease: false

      - name: Upload Release APK to Release
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: android/app/build/outputs/apk/release/apuntador-${{ steps.version.outputs.version }}-release.apk
          asset_name: apuntador-${{ steps.version.outputs.version }}-android.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Clean up keystore
        if: always()
        run: |
          rm -f android/app/apuntador-release-key.keystore
          rm -f android/key.properties
