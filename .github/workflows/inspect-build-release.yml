name: Inspect, Build and Release

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'hotfix/*'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'Manual building'
env:
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm

jobs:
  inspect-build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # - name: Install Angular CLI
      #   run: npm install -g @angular/cli@17.1.3

      - name: Cache NPM packages
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: NPM run clean installation
        run: npm ci

      - name: Run tests
        run: npm test

      # - name: Test
      #   run: npm test -- --watch=false --browsers=ChromeHeadlessCI --code-coverage --reporters="junit,jasmine-order"
      #   working-directory: ${{ github.workspace }}

      - name: Commit any pending changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add .
          git commit -m "Commit pending changes" || echo "No changes to commit"

      - name: npm update patch version
        run: |
          npm version patch

      - name: Commit and push version update
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add package.json
          git commit -m "Update version" || echo "No changes to commit"
          git push origin HEAD || echo "Push failed, continuing with release creation"

      - name: Create .env file
        run: |
          echo "[NOTE] Creating .env file from secrets..."
          cat > .env << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF
          echo "[OK] .env file created successfully"
          echo "[LIST] Variables configured (masked):"
          grep -E '^[^#]' .env | cut -d'=' -f1 | sed 's/^/   ✓ /' || echo "   (no variables found)"

      - name: npm build
        run: |
          npm run build

      - name: Determine branch suffix
        id: branch_suffix
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Branch: $BRANCH_NAME"

          case "$BRANCH_NAME" in
            "main")
              SUFFIX=""
              BRANCH_TYPE="main"
              ;;
            "develop")
              SUFFIX="-dev"
              BRANCH_TYPE="develop"
              ;;
            feature/*)
              SUFFIX="-feature"
              BRANCH_TYPE="feature"
              ;;
            hotfix/*)
              SUFFIX="-hotfix"
              BRANCH_TYPE="hotfix"
              ;;
            *)
              SUFFIX="-${BRANCH_NAME//\//-}"
              BRANCH_TYPE="other"
              ;;
          esac

          echo "suffix=${SUFFIX}" >> $GITHUB_OUTPUT
          echo "branch_type=${BRANCH_TYPE}" >> $GITHUB_OUTPUT
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "Branch suffix: '${SUFFIX}'"

      - name: Read VERSION and set ImageTag
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          SUFFIX="${{ steps.branch_suffix.outputs.suffix }}"
          VERSION="${BASE_VERSION}${SUFFIX}"
          echo "Base version: ${BASE_VERSION}"
          echo "Suffix: ${SUFFIX}"
          echo "Final version: ${VERSION}"
          echo "IMAGE_TAG=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT

      - name: Compress dist directory
        run: |
          cd dist/
          zip -r ../${{ steps.version.outputs.version }}.zip ./*

      - name: Show files in workspace
        run: |
          ls -la ${{ github.workspace }}

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apuntador
          path: dist/
          if-no-files-found: error

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Apuntador Web v${{ steps.version.outputs.version }}
          body: |
            ## Apuntador Web v${{ steps.version.outputs.version }}

            ### [PACKAGE] Web Application Release
            This release contains the built web application ready for deployment.

            **Branch**: `${{ steps.branch_suffix.outputs.branch_name }}` (${{ steps.branch_suffix.outputs.branch_type }})
            **Base Version**: ${{ steps.version.outputs.base_version }}
            **Release Tag**: ${{ steps.version.outputs.version }}

            ### [LAUNCH] Deployment Options
            - **Static Hosting**: Extract the ZIP to any web server or CDN
            - **Cloud Deployment**: Use the `deploy-release` workflow with:
              - Release tag: `${{ steps.version.outputs.version }}`
              - Environment: `dev` / `pre` / `pro`

            ### [MOBILE] To Create Native Packages
            Use the available build workflows with this release tag: `${{ steps.version.outputs.version }}`

            **Available Workflows:**
            - `build-android-apk` - Android APK
            - `build-android-bundle` - Android AAB (Play Store)
            - `build-windows-desktop` - Windows MSI/NSIS
            - `build-macos-desktop` - macOS DMG
            - `build-linux-desktop` - Linux AppImage/DEB
            - `build-ios-appstore` - iOS App Store

            ### [CONFIG] Installation
            Extract the ZIP file and serve from any web server or static hosting service.
          files: |
            ${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: ${{ steps.branch_suffix.outputs.branch_type != 'main' }}
