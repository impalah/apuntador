name: Inspect, Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'Manual building'
env:
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm

jobs:
  inspect-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # - name: Install Angular CLI
      #   run: npm install -g @angular/cli@17.1.3

      - name: Cache NPM packages
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: NPM run clean installation
        run: npm ci

      - name: Run tests
        run: npm test

      # - name: Test
      #   run: npm test -- --watch=false --browsers=ChromeHeadlessCI --code-coverage --reporters="junit,jasmine-order"
      #   working-directory: ${{ github.workspace }}

      - name: Commit any pending changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add .
          git commit -m "Commit pending changes" || echo "No changes to commit"

      - name: npm update patch version
        run: |
          npm version patch

      - name: Commit and push version update
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add package.json
          git commit -m "Update version" || echo "No changes to commit"
          git push origin HEAD

      - name: npm build
        run: |
          npm run build

      - name: Read VERSION and set ImageTag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "IMAGE_TAG=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Compress dist directory
        run: |
          cd dist/
          zip -r ../${{ steps.version.outputs.version }}.zip ./*

      - name: Show files in workspace
        run: |
          ls -la ${{ github.workspace }}

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apuntador
          path: dist/
          if-no-files-found: error

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Apuntador Web v${{ steps.version.outputs.version }}
          body: |
            ## Apuntador Web v${{ steps.version.outputs.version }}

            ### 📦 Web Application Release
            This release contains the built web application ready for deployment.

            ### 🚀 Deployment Options
            - **Static Hosting**: Extract the ZIP to any web server
            - **GitHub Pages**: Deploy directly from this release  
            - **S3/CloudFront**: Use with the deploy-release workflow
            - **Android APK**: Use this release with the build-android-apk workflow

            ### 📱 To Create Android APK
            1. Go to Actions → Build Android APK
            2. Run workflow manually
            3. Enter this release tag: `${{ steps.version.outputs.version }}`
            4. Select build type (release/debug)

            ### ✨ Features
            - Mobile-first responsive design
            - Auto-scrolling teleprompter
            - Highlight band for current line focus
            - Mirror modes (horizontal/vertical)
            - Touch and keyboard controls
            - Markdown support with live editing
            - Dark/Light themes
            - File import (.md/.txt)

            ### 🔧 Installation
            Extract the ZIP file and serve from any web server or static hosting service.
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload_release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/${{ steps.version.outputs.version }}.zip
          asset_name: ${{ steps.version.outputs.version }}.zip
          asset_content_type: application/zip
