name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - debug
          - info
          - warning
          - error
      release_tag:
        description: 'Release tag to build from (e.g., 0.1.24)'
        required: true
        type: string
      buildType:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      generateInstallers:
        description: 'Generate MSI and NSIS installers'
        required: false
        default: true
        type: boolean
      environment:
        description: 'Environment to deploy (only for release builds)'
        required: true
        type: choice
        options:
          - dev
          - pre
          - pro
        default: 'dev'

env:
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm
  RUST_BACKTRACE: 1

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    environment: ${{ inputs.buildType == 'release' && inputs.generateInstallers == true && inputs.environment || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies (minimal for Tauri)
        run: npm ci --prefer-offline --no-audit

      - name: Create .env file
        run: |
          Write-Host "[NOTE] Creating .env file from secrets..." -ForegroundColor Yellow
          @"
          ${{ secrets.ENV_FILE }}
          "@ | Out-File -FilePath .env -Encoding UTF8

          Write-Host "[OK] .env file created successfully" -ForegroundColor Green
          Write-Host "[LIST] Variables configured (masked):" -ForegroundColor Cyan
          Get-Content .env | Where-Object { $_ -match '^[^#]' } | ForEach-Object {
            $varName = ($_ -split '=')[0]
            Write-Host "   ✓ $varName" -ForegroundColor White
          }

      - name: Setup environment variables
        run: |
          echo "TAURI_PRIVATE_KEY=${{ secrets.TAURI_PRIVATE_KEY }}" >> $env:GITHUB_ENV
          echo "TAURI_KEY_PASSWORD=${{ secrets.TAURI_KEY_PASSWORD }}" >> $env:GITHUB_ENV

      - name: Setup code signing certificate
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # Verificar si el certificado está disponible
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "[WARNING] No se encontró certificado de código - continuando sin firma..." -ForegroundColor Yellow
            Write-Host "   Para habilitar la firma de código, configura los secrets:" -ForegroundColor Cyan
            Write-Host "   - WINDOWS_CERTIFICATE_BASE64 (certificado PFX en Base64)" -ForegroundColor Cyan
            Write-Host "   - WINDOWS_CERTIFICATE_PASSWORD (contraseña del certificado)" -ForegroundColor Cyan
            Write-Host "" -ForegroundColor White
            Write-Host "   Ver docs/WINDOWS_CODE_SIGNING.md para más información" -ForegroundColor Cyan
            exit 0
          }

          Write-Host "[SECURE] Configurando certificado de código..." -ForegroundColor Yellow

          # Crear directorio temporal para el certificado
          $certDir = "temp-cert"
          New-Item -ItemType Directory -Path $certDir -Force | Out-Null

          # Decodificar el certificado Base64 y guardarlo como PFX
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          $certPath = Join-Path $certDir "codesigning.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          # Importar el certificado al almacén local
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText

          try {
            $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $securePassword -ErrorAction Stop

            Write-Host "[OK] Certificado importado exitosamente" -ForegroundColor Green
            Write-Host "   Subject: $($cert.Subject)" -ForegroundColor White
            Write-Host "   Issuer: $($cert.Issuer)" -ForegroundColor White
            Write-Host "   Thumbprint: $($cert.Thumbprint)" -ForegroundColor White
            Write-Host "   Válido desde: $($cert.NotBefore)" -ForegroundColor White
            Write-Host "   Válido hasta: $($cert.NotAfter)" -ForegroundColor White
            
            # Verificar que el certificado es válido para firma de código
            $codeSigningEku = $cert.EnhancedKeyUsageList | Where-Object { $_.ObjectId -eq "1.3.6.1.5.5.7.3.3" }
            if ($codeSigningEku) {
              Write-Host "   [OK] Certificado válido para firma de código" -ForegroundColor Green
            } else {
              Write-Host "   [WARNING] Advertencia: Este certificado podría no ser válido para firma de código" -ForegroundColor Yellow
            }
            
            # Configurar variable de entorno para Tauri
            echo "WINDOWS_CODESIGN_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
            
          } catch {
            Write-Host "[ERROR] Error al importar certificado: $($_.Exception.Message)" -ForegroundColor Red
            Write-Host "   Verifica que WINDOWS_CERTIFICATE_PASSWORD sea correcto" -ForegroundColor Yellow
            exit 1
          } finally {
            # Limpiar archivos temporales
            if (Test-Path $certPath) {
              Remove-Item $certPath -Force
            }
            if (Test-Path $certDir) {
              Remove-Item $certDir -Force
            }
          }

      - name: Download release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          Write-Host "Downloading release asset for tag: ${env:RELEASE_TAG}" -ForegroundColor Yellow

          # Get the release by tag
          $headers = @{
            "Authorization" = "token ${env:GITHUB_TOKEN}"
            "Accept" = "application/vnd.github.v3+json"
          }
          $releaseUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/${env:RELEASE_TAG}"
          $releaseData = Invoke-RestMethod -Uri $releaseUrl -Headers $headers

          # Find ZIP asset
          $zipAsset = $releaseData.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1

          if (-not $zipAsset) {
            Write-Host "[ERROR] No ZIP asset found for release ${env:RELEASE_TAG}" -ForegroundColor Red
            Write-Host "Available assets:" -ForegroundColor Yellow
            $releaseData.assets | ForEach-Object { Write-Host "  - $($_.name)" }
            exit 1
          }

          Write-Host "[PACKAGE] Downloading: $($zipAsset.name)" -ForegroundColor Cyan
          $downloadUrl = $zipAsset.browser_download_url
          $outputFile = "release-${env:RELEASE_TAG}.zip"

          Invoke-WebRequest -Uri $downloadUrl -Headers $headers -OutFile $outputFile

          if (-not (Test-Path $outputFile)) {
            Write-Host "[ERROR] Failed to download release asset" -ForegroundColor Red
            exit 1
          }

          Write-Host "[OK] Downloaded $outputFile" -ForegroundColor Green
          Get-Item $outputFile | Format-List

      - name: Extract and prepare web build
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          Write-Host "Extracting release-${env:RELEASE_TAG}.zip to dist/" -ForegroundColor Yellow
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Expand-Archive -Path "release-${env:RELEASE_TAG}.zip" -DestinationPath dist/ -Force

          Write-Host "Contents of dist directory:" -ForegroundColor Cyan
          Get-ChildItem -Path dist/ | Format-Table Name, Length

      - name: Update version in Cargo.toml
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          Write-Host "[NOTE] Updating version in Cargo.toml to ${env:RELEASE_TAG}" -ForegroundColor Yellow

          $cargoPath = "src-tauri\Cargo.toml"
          $content = Get-Content $cargoPath -Raw

          # Update ONLY the package version line (not rust-version)
          # Match: version = "..." that appears right after [package] section
          $content = $content -replace '(?m)(\[package\][^\[]*?version\s*=\s*")[^"]+(")', "`${1}${env:RELEASE_TAG}`$2"

          Set-Content -Path $cargoPath -Value $content -NoNewline

          Write-Host "[OK] Version updated successfully" -ForegroundColor Green
          Write-Host "[LIST] Verifying Cargo.toml:" -ForegroundColor Cyan
          Get-Content $cargoPath | Select-String -Pattern '(^\[package\]|^version|^rust-version)' | Select-Object -First 5

      - name: Build Tauri app (Debug)
        if: ${{ github.event.inputs.buildType == 'debug' }}
        run: |
          if ($env:WINDOWS_CODESIGN_CERT_THUMBPRINT) {
            Write-Host "[SECURE] Building with Windows certificate signing..." -ForegroundColor Yellow
            Write-Host "   Thumbprint: $env:WINDOWS_CODESIGN_CERT_THUMBPRINT" -ForegroundColor Cyan
            
            # Update tauri.conf.json with certificate thumbprint for Windows signing
            $configPath = "src-tauri\tauri.conf.json"
            $config = Get-Content $configPath -Raw | ConvertFrom-Json
            $config.bundle.windows.certificateThumbprint = $env:WINDOWS_CODESIGN_CERT_THUMBPRINT
            $config.bundle.windows.digestAlgorithm = "sha256"
            $config.bundle.windows.timestampUrl = "http://timestamp.sectigo.com"
            $config | ConvertTo-Json -Depth 10 | Set-Content $configPath
            
            Write-Host "[OK] Tauri configured for Windows certificate signing" -ForegroundColor Green
          } else {
            Write-Host "� Building with Tauri key signing..." -ForegroundColor Yellow
            # Set Tauri signing environment variables
            $env:TAURI_SIGNING_PRIVATE_KEY = "${{ secrets.TAURI_PRIVATE_KEY }}"
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = "${{ secrets.TAURI_KEY_PASSWORD }}"
          }
          npm run tauri:build -- --debug

      - name: Build Tauri app (Release)
        if: ${{ github.event.inputs.buildType == 'release' }}
        run: |
          if ($env:WINDOWS_CODESIGN_CERT_THUMBPRINT) {
            Write-Host "[SECURE] Building with Windows certificate signing..." -ForegroundColor Yellow
            Write-Host "   Thumbprint: $env:WINDOWS_CODESIGN_CERT_THUMBPRINT" -ForegroundColor Cyan
            
            # Update tauri.conf.json with certificate thumbprint for Windows signing
            $configPath = "src-tauri\tauri.conf.json"
            $config = Get-Content $configPath -Raw | ConvertFrom-Json
            $config.bundle.windows.certificateThumbprint = $env:WINDOWS_CODESIGN_CERT_THUMBPRINT
            $config.bundle.windows.digestAlgorithm = "sha256"
            $config.bundle.windows.timestampUrl = "http://timestamp.sectigo.com"
            $config | ConvertTo-Json -Depth 10 | Set-Content $configPath
            
            Write-Host "[OK] Tauri configured for Windows certificate signing" -ForegroundColor Green
          } else {
            Write-Host "� Building with Tauri key signing..." -ForegroundColor Yellow
            # Set Tauri signing environment variables
            $env:TAURI_SIGNING_PRIVATE_KEY = "${{ secrets.TAURI_PRIVATE_KEY }}"
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = "${{ secrets.TAURI_KEY_PASSWORD }}"
          }
          npm run tauri:build:win

      - name: List generated files
        run: |
          Write-Host "=== Archivos generados ===" -ForegroundColor Green
          $bundlePath = "src-tauri\target\x86_64-pc-windows-msvc\${{ github.event.inputs.buildType }}\bundle"
          $releasePath = "src-tauri\target\x86_64-pc-windows-msvc\${{ github.event.inputs.buildType }}"

          if (Test-Path $bundlePath) {
            Write-Host "Bundle directory contents:" -ForegroundColor Yellow
            Get-ChildItem $bundlePath -Recurse -File | ForEach-Object {
              $sizeMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "  $($_.Name) ($sizeMB MB) - $($_.FullName)" -ForegroundColor Cyan
            }
          }

          if (Test-Path "$releasePath\apuntador.exe") {
            $size = [math]::Round((Get-Item "$releasePath\apuntador.exe").Length / 1MB, 2)
            Write-Host "Main executable: apuntador.exe ($size MB)" -ForegroundColor Green
          }

      - name: Create artifacts directory
        run: |
          New-Item -Path "artifacts" -ItemType Directory -Force
          New-Item -Path "artifacts\installers" -ItemType Directory -Force

      - name: Copy executable
        run: |
          $buildType = "${{ github.event.inputs.buildType }}"
          $exePath = "src-tauri\target\x86_64-pc-windows-msvc\$buildType\apuntador.exe"

          if (Test-Path $exePath) {
            Copy-Item $exePath "artifacts\apuntador-${{ github.event.inputs.release_tag }}-windows-x64.exe"
            Write-Host "[OK] Executable copied successfully" -ForegroundColor Green
          } else {
            Write-Host "[ERROR] Executable not found at $exePath" -ForegroundColor Red
            exit 1
          }

      - name: Copy MSI installer
        if: ${{ github.event.inputs.generateInstallers == 'true' }}
        run: |
          $buildType = "${{ github.event.inputs.buildType }}"
          $msiPath = "src-tauri\target\x86_64-pc-windows-msvc\$buildType\bundle\msi\*.msi"

          $msiFiles = Get-ChildItem $msiPath -ErrorAction SilentlyContinue
          if ($msiFiles) {
            foreach ($msi in $msiFiles) {
              $newName = "apuntador-${{ github.event.inputs.release_tag }}-windows-x64-installer.msi"
              Copy-Item $msi.FullName "artifacts\installers\$newName"
              Write-Host "[OK] MSI installer copied: $newName" -ForegroundColor Green
            }
          } else {
            Write-Host "[WARNING] No MSI installer found" -ForegroundColor Yellow
          }

      - name: Copy NSIS installer
        if: ${{ github.event.inputs.generateInstallers == 'true' }}
        run: |
          $buildType = "${{ github.event.inputs.buildType }}"
          $nsisPath = "src-tauri\target\x86_64-pc-windows-msvc\$buildType\bundle\nsis\*.exe"

          $nsisFiles = Get-ChildItem $nsisPath -ErrorAction SilentlyContinue
          if ($nsisFiles) {
            foreach ($nsis in $nsisFiles) {
              $newName = "apuntador-${{ github.event.inputs.release_tag }}-windows-x64-setup.exe"
              Copy-Item $nsis.FullName "artifacts\installers\$newName"
              Write-Host "[OK] NSIS installer copied: $newName" -ForegroundColor Green
            }
          } else {
            Write-Host "[WARNING] No NSIS installer found" -ForegroundColor Yellow
          }

      - name: Generate build info
        run: |
          $buildInfo = @{
            timestamp = (Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
            tag = "${{ github.event.inputs.release_tag }}"
            buildType = "${{ github.event.inputs.buildType }}"
            commit = "${{ github.sha }}"
            workflow = "${{ github.run_id }}"
            runner = "${{ runner.os }}"
          }

          $buildInfo | ConvertTo-Json | Out-File "artifacts\build-info.json" -Encoding UTF8
          Write-Host "[OK] Build info generated" -ForegroundColor Green

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: apuntador-windows-executable-${{ github.event.inputs.release_tag }}
          path: artifacts/apuntador-*.exe
          retention-days: 30

      - name: Upload installers artifact
        if: ${{ github.event.inputs.generateInstallers == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: apuntador-windows-installers-${{ github.event.inputs.release_tag }}
          path: artifacts/installers/
          retention-days: 30

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: apuntador-windows-build-info-${{ github.event.inputs.release_tag }}
          path: artifacts/build-info.json
          retention-days: 90

      - name: Create Release (if release tag)
        if: ${{ github.event.inputs.buildType == 'release' && startsWith(github.event.inputs.release_tag, '0.') }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.release_tag }}
          name: Apuntador v${{ github.event.inputs.release_tag }} - Windows Desktop
          draft: true
          prerelease: false
          files: |
            artifacts/apuntador-*.exe
            artifacts/installers/*
            artifacts/build-info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload to apuntador.io S3 bucket (only for release builds with installers)
      - name: Configure AWS credentials for apuntador.io
        if: ${{ github.event.inputs.buildType == 'release' && github.event.inputs.generateInstallers == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.APUNTADOR_IO_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.APUNTADOR_IO_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.APUNTADOR_IO_AWS_REGION }}

      - name: Upload MSI to apuntador.io S3
        if: ${{ github.event.inputs.buildType == 'release' && github.event.inputs.generateInstallers == 'true' }}
        shell: pwsh
        env:
          S3_BUCKET: ${{ vars.APUNTADOR_IO_S3_BUCKET }}
          VERSION: ${{ github.event.inputs.release_tag }}
        run: |
          $msiPath = "artifacts\installers\apuntador-${env:VERSION}-windows-x64-installer.msi"
          $targetFilename = "apuntador-${env:VERSION}-windows-x64-installer.msi"

          Write-Host "[UP]  Uploading MSI to apuntador.io..." -ForegroundColor Yellow
          Write-Host "   Source: $msiPath" -ForegroundColor Cyan
          Write-Host "   Destination: s3://${env:S3_BUCKET}/downloads/$targetFilename" -ForegroundColor Cyan

          aws s3 cp "$msiPath" "s3://${env:S3_BUCKET}/downloads/$targetFilename" `
            --acl public-read `
            --metadata "version=${env:VERSION},type=windows-msi,uploaded=$(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')"

          Write-Host "[OK] MSI uploaded successfully" -ForegroundColor Green

      - name: Update versions.json
        if: ${{ github.event.inputs.buildType == 'release' && github.event.inputs.generateInstallers == 'true' }}
        shell: pwsh
        env:
          S3_BUCKET: ${{ vars.APUNTADOR_IO_S3_BUCKET }}
          VERSION: ${{ github.event.inputs.release_tag }}
        run: |
          $targetFilename = "apuntador-${env:VERSION}-windows-x64-installer.msi"

          Write-Host "[DOWN]  Downloading current versions.json..." -ForegroundColor Yellow
          try {
            aws s3 cp "s3://${env:S3_BUCKET}/downloads/versions.json" versions.json 2>$null
            Write-Host "[OK] Downloaded existing versions.json" -ForegroundColor Green
          } catch {
            Write-Host "[WARNING]  versions.json not found, creating new one" -ForegroundColor Yellow
            '{}' | Out-File -FilePath versions.json -Encoding UTF8
          }

          Write-Host "[NOTE] Updating versions.json..." -ForegroundColor Yellow

          # Install jq if not available (Windows runner usually has it)
          $versionsContent = Get-Content versions.json -Raw | ConvertFrom-Json
          $versionsContent | Add-Member -MemberType NoteProperty -Name "windows-msi" -Value $targetFilename -Force
          $versionsContent | ConvertTo-Json | Out-File -FilePath versions.json -Encoding UTF8

          Write-Host "[OK] Updated versions.json:" -ForegroundColor Green
          Get-Content versions.json

          Write-Host "[UP]  Uploading updated versions.json..." -ForegroundColor Yellow
          aws s3 cp versions.json "s3://${env:S3_BUCKET}/downloads/versions.json" `
            --acl public-read `
            --content-type "application/json" `
            --metadata "last-updated=$(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')"

          Write-Host "[OK] versions.json updated successfully" -ForegroundColor Green
          Write-Host "📍 Public URL: https://${env:S3_BUCKET}.s3.amazonaws.com/downloads/versions.json" -ForegroundColor Cyan

      - name: Generate Winget Manifests
        if: ${{ github.event.inputs.buildType == 'release' && github.event.inputs.generateInstallers == 'true' }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          Write-Host "[PACKAGE] Generating Winget manifests for version $env:RELEASE_TAG..." -ForegroundColor Cyan

          $version = $env:RELEASE_TAG
          $msiPath = "artifacts\installers\apuntador-$version-windows-x64-installer.msi"
          $msiUrl = "https://apuntador.io/downloads/apuntador-$version-windows-x64-installer.msi"

          # Calcular SHA256
          Write-Host "[SECURE] Calculating SHA256 hash..." -ForegroundColor Yellow
          $hash = (Get-FileHash -Path $msiPath -Algorithm SHA256).Hash
          Write-Host "   SHA256: $hash" -ForegroundColor White

          # Extraer ProductCode del MSI
          Write-Host "[SEARCH] Extracting ProductCode from MSI..." -ForegroundColor Yellow
          try {
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $database = $installer.GetType().InvokeMember("OpenDatabase", "InvokeMethod", $null, $installer, @($msiPath, 0))
            $view = $database.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $database, ("SELECT Value FROM Property WHERE Property='ProductCode'"))
            $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null)
            $record = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
            $productCode = $record.GetType().InvokeMember("StringData", "GetProperty", $null, $record, 1)
            Write-Host "   ProductCode: $productCode" -ForegroundColor White
          } catch {
            Write-Host "   [WARNING] Could not extract ProductCode" -ForegroundColor Yellow
            $productCode = "{PLACEHOLDER-GUID}"
          }

          # Crear directorio para manifests
          $manifestDir = "winget-manifests\$version"
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null

          Write-Host "[NOTE] Creating manifest files from templates..." -ForegroundColor Yellow

          # Copiar y procesar templates
          Get-ChildItem .github\winget-templates\*.yaml | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $content = $content -replace '{{VERSION}}', $version
            $content = $content -replace '{{INSTALLER_URL}}', $msiUrl
            $content = $content -replace '{{SHA256}}', $hash
            $content = $content -replace '{{PRODUCT_CODE}}', $productCode
            
            $outputFile = Join-Path $manifestDir $_.Name
            $content | Out-File -FilePath $outputFile -Encoding UTF8 -NoNewline
            Write-Host "   ✓ $($_.Name)" -ForegroundColor Green
          }

          Write-Host ""
          Write-Host "[OK] Winget manifests generated successfully" -ForegroundColor Green
          Write-Host "[LIST] Generated files:" -ForegroundColor Cyan
          Get-ChildItem $manifestDir | ForEach-Object {
            Write-Host "   - $($_.Name)" -ForegroundColor White
          }

      - name: Upload Winget Manifests as Artifact
        if: ${{ github.event.inputs.buildType == 'release' && github.event.inputs.generateInstallers == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ github.event.inputs.release_tag }}
          path: winget-manifests/${{ github.event.inputs.release_tag }}/
          retention-days: 90
          if-no-files-found: error

      - name: Build Summary
        run: |
          Write-Host ""
          Write-Host "[SUCCESS] Build completed successfully!" -ForegroundColor Green
          Write-Host ""
          Write-Host "[PACKAGE] Generated artifacts:" -ForegroundColor Yellow

          Get-ChildItem "artifacts" -Recurse -File | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  📁 $($_.Name) ($sizeMB MB)" -ForegroundColor Cyan
          }

          Write-Host ""
          Write-Host "[LINK] Download artifacts from the Actions tab" -ForegroundColor Blue
          Write-Host "[LAUNCH] Ready for distribution!" -ForegroundColor Green
