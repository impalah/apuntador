name: Build iOS App Store Package

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      release_tag:
        description: 'Release tag to build iOS app from (e.g., 1.0.9)'
        required: true
        type: string
      versionCode:
        description: 'iOS build number (integer, must be higher than previous)'
        required: true
        type: number
      upload_to_testflight:
        description: 'Upload to TestFlight after build'
        required: true
        default: false
        type: boolean

env:
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm

jobs:
  build-ios-app:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Install dependencies (minimal for Capacitor)
        run: npm ci

      - name: Download release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          echo "Downloading release asset for tag: ${RELEASE_TAG}"

          # Get the release by tag
          RELEASE_DATA=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}")

          # Extract the download URL for the ZIP asset
          DOWNLOAD_URL=$(echo "${RELEASE_DATA}" | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url')

          if [ "${DOWNLOAD_URL}" = "null" ] || [ -z "${DOWNLOAD_URL}" ]; then
            echo "[ERROR] No ZIP asset found for release ${RELEASE_TAG}"
            echo "Available assets:"
            echo "${RELEASE_DATA}" | jq -r '.assets[].name'
            exit 1
          fi

          echo "Downloading: ${DOWNLOAD_URL}"
          curl -L -H "Authorization: token ${GITHUB_TOKEN}" \
            -o "release-${RELEASE_TAG}.zip" \
            "${DOWNLOAD_URL}"

          # Verify download
          if [ ! -f "release-${RELEASE_TAG}.zip" ]; then
            echo "[ERROR] Failed to download release asset"
            exit 1
          fi

          echo "Downloaded release-${RELEASE_TAG}.zip"
          ls -la "release-${RELEASE_TAG}.zip"

      - name: Extract and prepare web build
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          echo "Extracting release-${RELEASE_TAG}.zip to dist/"
          mkdir -p dist
          unzip "release-${RELEASE_TAG}.zip" -d dist/

          echo "Contents of dist directory:"
          ls -la dist/

          echo "Web build ready for Capacitor"

      - name: Update iOS version in project
        env:
          VERSION_CODE: ${{ github.event.inputs.versionCode }}
          VERSION_NAME: ${{ github.event.inputs.release_tag }}
        run: |
          echo "Updating iOS version..."
          echo "  Build Number: ${VERSION_CODE}"
          echo "  Version: ${VERSION_NAME}"

          # Update version in project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = ${VERSION_CODE}/" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = ${VERSION_NAME}/" ios/App/App.xcodeproj/project.pbxproj

          echo "Updated iOS version numbers"

      - name: Setup iOS signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "Setting up iOS code signing..."

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/Apuntador\ App\ Store\ Distribution.mobileprovision

          echo "iOS signing configured"

      - name: Prepare iOS project
        run: |
          echo "Preparing iOS project..."
          npx cap copy ios
          npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          echo "Installing CocoaPods dependencies..."
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Debug iOS Project Configuration
        run: |
          echo "Debugging iOS project configuration..."
          cd ios/App

          # Check project settings
          echo "Project deployment target:"
          grep -A5 -B5 "IPHONEOS_DEPLOYMENT_TARGET" App.xcodeproj/project.pbxproj | head -20

          echo "Scheme configuration:"
          xcodebuild -workspace App.xcworkspace -list

          echo "Available destinations (full):"
          xcodebuild -workspace App.xcworkspace -scheme App -showdestinations

      - name: Fix iOS Scheme Configuration
        run: |
          echo "Fixing iOS scheme configuration for archiving..."
          cd ios/App

          # Get the actual target UUID from project.pbxproj
          echo "Finding App target UUID..."
          APP_TARGET_UUID=$(grep -A1 'targets = (' App.xcodeproj/project.pbxproj | grep -o '[A-F0-9]\{24\}' | head -1)
          echo "App target UUID: ${APP_TARGET_UUID}"

          if [ -z "$APP_TARGET_UUID" ]; then
            echo "[ERROR] Could not find App target UUID, using alternative method..."
            APP_TARGET_UUID=$(grep -E '\/\* App \*\/ = \{' App.xcodeproj/project.pbxproj | grep -o '[A-F0-9]\{24\}' | head -1)
            echo "Alternative UUID: ${APP_TARGET_UUID}"
          fi

          # Check if scheme exists and is configured for archiving
          echo "Creating scheme directory..."
          mkdir -p App.xcodeproj/xcshareddata/xcschemes

          # Create a proper scheme file with correct UUID
          echo "Creating scheme with correct target UUID..."
          cat > App.xcodeproj/xcshareddata/xcschemes/App.xcscheme << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             LastUpgradeVersion = "1600"
             version = "1.7">
             <BuildAction
                parallelizeBuildables = "YES"
                buildImplicitDependencies = "YES">
                <BuildActionEntries>
                   <BuildActionEntry
                      buildForTesting = "YES"
                      buildForRunning = "YES"
                      buildForProfiling = "YES"
                      buildForArchiving = "YES"
                      buildForAnalyzing = "YES">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "\${APP_TARGET_UUID}"
                         BuildableName = "App.app"
                         BlueprintName = "App"
                         ReferencedContainer = "container:App.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <ArchiveAction
                buildConfiguration = "Release"
                revealArchiveInOrganizer = "YES">
             </ArchiveAction>
          </Scheme>
          EOF

          echo "Scheme created with target UUID: \${APP_TARGET_UUID}"

      - name: Build and Archive iOS app
        run: |
          echo "Building iOS app for App Store..."
          cd ios/App

          # Simple archive approach - let Xcode handle destinations
          echo "Creating archive with simplified approach..."
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ${{ github.workspace }}/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="Apuntador App Store Distribution" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO

          echo "Archive created successfully"

      - name: Export IPA for App Store
        run: |
          echo "Exporting IPA for App Store..."

          # Create export options plist
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.IOS_TEAM_ID }}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath ${{ github.workspace }}/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ${{ github.workspace }}/export

          # Rename IPA
          mv export/App.ipa "export/Apuntador-${{ github.event.inputs.release_tag }}-${{ github.event.inputs.versionCode }}.ipa"

          echo "IPA exported successfully"
          ls -la export/

      - name: Upload to TestFlight (Optional)
        if: ${{ github.event.inputs.upload_to_testflight == 'true' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          echo "Uploading to TestFlight..."

          # Check if API key secrets are available
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "[WARNING] App Store Connect API Key secrets not configured"
            echo "Manual upload required:"
            echo "  1. Download IPA from GitHub Actions artifacts"
            echo "  2. Use Xcode Organizer or Transporter app to upload"
            echo "  3. Or configure API Key secrets for automatic upload"
            exit 0
          fi

          # Decode API key
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > AuthKey.p8

          # Upload to TestFlight using altool
          xcrun altool \
            --upload-app \
            --type ios \
            --file "export/Apuntador-${{ github.event.inputs.release_tag }}-${{ github.event.inputs.versionCode }}.ipa" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

          echo "Upload to TestFlight completed"

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apuntador-iOS-${{ github.event.inputs.release_tag }}-${{ github.event.inputs.versionCode }}
          path: export/Apuntador-${{ github.event.inputs.release_tag }}-${{ github.event.inputs.versionCode }}.ipa
          retention-days: 30

      - name: Create Release Notes
        run: |
          echo "Creating release notes..."
          cat > ios-release-notes.md << EOF
          # iOS Build - Apuntador v${{ github.event.inputs.release_tag }}

          ## Build Information
          - **Version**: ${{ github.event.inputs.release_tag }}
          - **Build Number**: ${{ github.event.inputs.versionCode }}
          - **Platform**: iOS
          - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Build Environment**: GitHub Actions (macOS)

          ## Files Generated
          - **IPA File**: Apuntador-${{ github.event.inputs.release_tag }}-${{ github.event.inputs.versionCode }}.ipa
          - **Archive**: App.xcarchive

          ## Next Steps
          $( [ "${{ github.event.inputs.upload_to_testflight }}" == "true" ] && echo "- **Uploaded to TestFlight automatically**" || echo "- **Manual upload**: Download IPA and upload via Xcode or Transporter" )
          - **App Store Connect**: Complete app information and submit for review
          - **TestFlight**: Test with internal/external testers

          ## Technical Details
          - **Bundle ID**: io.apuntador.app
          - **Minimum iOS**: 14.0
          - **Supported Devices**: iPhone, iPad
          - **Signing**: Apple Distribution Certificate
          - **Provisioning**: App Store Distribution Profile

          EOF

          echo "Release notes created"

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Release-Notes-${{ github.event.inputs.release_tag }}
          path: ios-release-notes.md
          retention-days: 90

      - name: Summary
        run: |
          echo "[SUCCESS] iOS build completed successfully!"
          echo ""
          echo "**Generated Files:**"
          echo "  - IPA: Apuntador-${{ github.event.inputs.release_tag }}-${{ github.event.inputs.versionCode }}.ipa"
          echo "  - Archive: App.xcarchive"
          echo "  - Release Notes: ios-release-notes.md"
          echo ""
          echo "**Next Steps:**"
          if [ "${{ github.event.inputs.upload_to_testflight }}" == "true" ]; then
            echo "  - Uploaded to TestFlight automatically"
            echo "  - Check App Store Connect for processing status"
          else
            echo "  - [DOWNLOAD] Download IPA from GitHub Actions artifacts"
            echo "  - Upload manually via Xcode or Transporter app"
          fi
          echo "  - Complete app metadata in App Store Connect"
          echo "  - Submit for App Store review"
          echo ""
          echo "[LINK] **Links:**"
          echo "  - App Store Connect: https://appstoreconnect.apple.com"
          echo "  - TestFlight: https://testflight.apple.com"
