name: Staple and Upload macOS DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., 0.1.24)'
        required: true
        type: string
      submission_id:
        description: 'Apple notarization submission ID'
        required: true
        type: string
      workflow_run_id:
        description: 'Workflow Run ID from Build macOS Desktop (find in URL)'
        required: true
        type: string
      buildTarget:
        description: 'Build target used in original build'
        required: true
        default: 'universal'
        type: choice
        options:
          - universal
          - aarch64-apple-darwin
          - x86_64-apple-darwin
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - pre
          - pro
        default: 'dev'

jobs:
  staple-and-upload:
    runs-on: macos-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download DMG artifact from previous build
        uses: actions/download-artifact@v4
        with:
          name: apuntador-macos-installers-${{ inputs.buildTarget }}-${{ inputs.release_tag }}
          path: artifacts/
          run-id: ${{ inputs.workflow_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded artifacts
        run: |
          echo "[PACKAGE] Downloaded artifacts:"
          ls -lah artifacts/
          
          # Find the DMG file
          DMG_FILE=$(find artifacts -name "*.dmg" | head -1)
          if [ -z "$DMG_FILE" ]; then
            echo "[ERROR] No DMG file found in artifacts"
            exit 1
          fi
          
          echo "[OK] Found DMG: $DMG_FILE"
          echo "DMG_PATH=$DMG_FILE" >> $GITHUB_ENV

      - name: Check notarization status
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          echo "[SEARCH] Checking notarization status..."
          echo "[LIST] Submission ID: $SUBMISSION_ID"
          
          STATUS_OUTPUT=$(xcrun notarytool info "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            2>&1)
          
          echo "$STATUS_OUTPUT"
          
          # Extract status
          STATUS=$(echo "$STATUS_OUTPUT" | grep "status:" | awk '{print $2}')
          
          if [ "$STATUS" != "Accepted" ]; then
            echo ""
            echo "[ERROR] ERROR: Notarization not accepted yet"
            echo "Current status: $STATUS"
            echo ""
            if [ "$STATUS" = "In Progress" ]; then
              echo "⏳ Apple is still processing. Please wait and try again later."
            elif [ "$STATUS" = "Invalid" ]; then
              echo "🚫 Notarization was REJECTED by Apple."
              echo ""
              echo "Get detailed logs with:"
              echo "  xcrun notarytool log $SUBMISSION_ID \\"
              echo "    --apple-id $APPLE_ID \\"
              echo "    --password \$APPLE_APP_SPECIFIC_PASSWORD \\"
              echo "    --team-id $APPLE_TEAM_ID"
            fi
            exit 1
          fi
          
          echo ""
          echo "[OK] Notarization status: Accepted"
          echo "Ready to staple!"
          
          # Wait a bit for CloudKit to sync the ticket
          echo ""
          echo "⏳ Waiting 30 seconds for ticket to sync to CloudKit..."
          sleep 30

      - name: Verify ticket availability
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          echo "[SEARCH] Checking if notarization ticket is available..."
          DMG_PATH="${{ env.DMG_PATH }}"
          
          # Try to get ticket info
          echo "Checking ticket status with notarytool..."
          xcrun notarytool info "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          
          echo ""
          echo "[OK] Ticket information retrieved successfully"

      - name: Mount DMG and staple ticket
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set +e  # Don't exit immediately on error so we can capture it
          
          echo "📀 Preparing DMG for stapling..."
          DMG_PATH="${{ env.DMG_PATH }}"
          
          echo "Original DMG: $DMG_PATH"
          ls -lh "$DMG_PATH"
          
          # Verify hdiutil is available
          echo ""
          echo "Checking hdiutil availability..."
          if ! command -v hdiutil &> /dev/null; then
            echo "[ERROR] hdiutil command not found!"
            exit 1
          fi
          
          # Convert DMG to read-write format
          echo ""
          echo "[REFRESH] Converting DMG to read-write format..."
          DMG_RW="${DMG_PATH%.dmg}-rw.dmg"
          hdiutil convert "$DMG_PATH" -format UDRW -o "$DMG_RW"
          
          if [ $? -ne 0 ]; then
            echo "[ERROR] Failed to convert DMG to read-write"
            exit 1
          fi
          
          echo "[OK] Converted to: $DMG_RW"
          ls -lh "$DMG_RW"
          
          # Mount the read-write DMG (auto-accept license)
          echo ""
          echo "📀 Mounting read-write DMG (auto-accepting license)..."
          MOUNT_OUTPUT=$(echo "Y" | hdiutil attach "$DMG_RW" -nobrowse 2>&1)
          MOUNT_EXIT=$?
          
          echo "Exit code: $MOUNT_EXIT"
          
          if [ $MOUNT_EXIT -ne 0 ]; then
            echo "[ERROR] Failed to mount DMG"
            echo "$MOUNT_OUTPUT"
            exit 1
          fi
          
          # Find the mounted volume
          VOLUME_PATH=$(echo "$MOUNT_OUTPUT" | grep "/Volumes" | awk '{print $NF}')
          
          if [ -z "$VOLUME_PATH" ]; then
            VOLUME_PATH=$(hdiutil info | grep "/Volumes/Apuntador" | head -1 | awk '{print $NF}')
          fi
          
          if [ -z "$VOLUME_PATH" ]; then
            echo "[ERROR] Failed to find mounted volume"
            exit 1
          fi
          
          echo "[OK] Mounted at: $VOLUME_PATH"
          
          # Find the .app bundle
          echo ""
          echo "[SEARCH] Searching for .app bundle..."
          ls -la "$VOLUME_PATH"
          
          APP_PATH=$(find "$VOLUME_PATH" -name "*.app" -type d -maxdepth 2 | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "[ERROR] No .app bundle found in DMG"
            hdiutil detach "$VOLUME_PATH" || true
            exit 1
          fi
          
          echo "[OK] Found app: $APP_PATH"
          
          # Extensive diagnostics before stapling
          echo ""
          echo "[SEARCH] === DIAGNOSTIC INFORMATION ==="
          echo ""
          
          echo "1️⃣ App bundle signature info:"
          codesign -dvvv "$APP_PATH" 2>&1 | head -20
          
          echo ""
          echo "2️⃣ App bundle executable hash:"
          EXECUTABLE="$APP_PATH/Contents/MacOS/Apuntador"
          if [ -f "$EXECUTABLE" ]; then
            echo "Executable: $EXECUTABLE"
            shasum -a 256 "$EXECUTABLE"
          else
            echo "[WARNING]  Executable not found at expected path"
            find "$APP_PATH/Contents/MacOS" -type f
          fi
          
          echo ""
          echo "3️⃣ Check if app is already notarized:"
          spctl -a -vv "$APP_PATH" 2>&1 || echo "Not notarized or rejected"
          
          echo ""
          echo "4️⃣ Check for existing stapled ticket:"
          xcrun stapler validate "$APP_PATH" 2>&1 || echo "No ticket stapled yet (expected)"
          
          echo ""
          echo "5️⃣ Notarization submission details:"
          echo "Submission ID: $SUBMISSION_ID"
          
          echo ""
          echo "6️⃣ Try to get notarization log:"
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            /tmp/notarization.log 2>&1 || echo "Could not retrieve log"
          
          if [ -f /tmp/notarization.log ]; then
            echo ""
            echo "7️⃣ Notarization log contents:"
            cat /tmp/notarization.log
          fi
          
          echo ""
          echo "=== END DIAGNOSTICS ==="
          echo ""
          
          # Staple the notarization ticket with retries
          echo ""
          echo "[PIN] Stapling notarization ticket..."
          
          MAX_RETRIES=3
          RETRY_DELAY=30
          STAPLE_EXIT=1
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            
            xcrun stapler staple "$APP_PATH" 2>&1 | tee /tmp/staple_output.txt
            STAPLE_EXIT=$?
            
            if [ $STAPLE_EXIT -eq 0 ]; then
              echo "[OK] Stapling successful!"
              break
            fi
            
            # Check if it's a "Record not found" error
            if grep -q "Record not found" /tmp/staple_output.txt; then
              if [ $i -lt $MAX_RETRIES ]; then
                echo "[WARNING]  Ticket not yet available in CloudKit, waiting ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              else
                echo "[ERROR] Ticket still not available after $MAX_RETRIES attempts"
              fi
            else
              # Different error, don't retry
              echo "[ERROR] Stapling failed with different error"
              break
            fi
          done
          
          if [ $STAPLE_EXIT -ne 0 ]; then
            echo "[ERROR] Failed to staple ticket after $MAX_RETRIES attempts"
            hdiutil detach "$VOLUME_PATH" || true
            exit 1
          fi
          
          # Verify stapling
          echo ""
          echo "[OK] Verifying stapled ticket..."
          xcrun stapler validate "$APP_PATH"
          VALIDATE_EXIT=$?
          
          if [ $VALIDATE_EXIT -ne 0 ]; then
            echo "[ERROR] Failed to validate stapled ticket"
            hdiutil detach "$VOLUME_PATH" || true
            exit 1
          fi
          
          echo ""
          echo "[OK] Ticket stapled successfully!"
          
          # Unmount the read-write DMG
          echo ""
          echo "📤 Unmounting DMG..."
          hdiutil detach "$VOLUME_PATH"
          
          if [ $? -ne 0 ]; then
            echo "[ERROR] Failed to unmount DMG"
            exit 1
          fi
          
          # Convert back to compressed format
          echo ""
          echo "🗜️  Converting DMG back to compressed format..."
          DMG_FINAL="${DMG_PATH%.dmg}-notarized.dmg"
          hdiutil convert "$DMG_RW" -format UDZO -o "$DMG_FINAL"
          
          if [ $? -ne 0 ]; then
            echo "[ERROR] Failed to convert DMG to compressed format"
            exit 1
          fi
          
          # Replace original DMG with notarized version
          mv "$DMG_FINAL" "$DMG_PATH"
          rm -f "$DMG_RW"
          
          echo "[OK] DMG updated with stapled ticket"
          ls -lh "$DMG_PATH"

      - name: Verify DMG signature and notarization
        run: |
          echo "[SEARCH] Final verification of DMG..."
          DMG_PATH="${{ env.DMG_PATH }}"
          
          # Mount again to verify (auto-accept license)
          echo "Mounting DMG for verification..."
          echo "Y" | hdiutil attach "$DMG_PATH" -nobrowse
          
          VOLUME_PATH=$(hdiutil info | grep "/Volumes/Apuntador" | head -1 | awk '{print $NF}')
          if [ -z "$VOLUME_PATH" ]; then
            VOLUME_PATH=$(ls -d /Volumes/Apuntador* 2>/dev/null | head -1)
          fi
          
          APP_PATH=$(find "$VOLUME_PATH" -name "*.app" -type d -maxdepth 2 | head -1)
          
          echo "App path: $APP_PATH"
          echo ""
          echo "Verifying code signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          
          echo ""
          echo "Verifying stapled notarization ticket..."
          xcrun stapler validate "$APP_PATH"
          
          echo ""
          echo "Checking Gatekeeper assessment..."
          spctl -a -vv "$APP_PATH"
          
          hdiutil detach "$VOLUME_PATH"
          
          echo ""
          echo "[OK] All verifications passed!"

      - name: Configure AWS credentials for apuntador.io
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.APUNTADOR_IO_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.APUNTADOR_IO_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.APUNTADOR_IO_AWS_REGION }}

      - name: Upload DMG to apuntador.io S3
        env:
          S3_BUCKET: ${{ vars.APUNTADOR_IO_S3_BUCKET }}
          VERSION: ${{ inputs.release_tag }}
        run: |
          DMG_PATH="${{ env.DMG_PATH }}"
          DMG_FILENAME=$(basename "$DMG_PATH")
          
          echo "[UP]  Uploading notarized DMG to apuntador.io..."
          echo "   Source: $DMG_PATH"
          echo "   Destination: s3://${S3_BUCKET}/downloads/$DMG_FILENAME"
          
          aws s3 cp "$DMG_PATH" "s3://${S3_BUCKET}/downloads/$DMG_FILENAME" \
            --acl public-read \
            --metadata "version=${VERSION},type=macos-dmg,notarized=true,uploaded=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          echo "[OK] DMG uploaded successfully"

      - name: Update versions.json
        env:
          S3_BUCKET: ${{ vars.APUNTADOR_IO_S3_BUCKET }}
          VERSION: ${{ inputs.release_tag }}
        run: |
          DMG_PATH="${{ env.DMG_PATH }}"
          DMG_FILENAME=$(basename "$DMG_PATH")
          
          echo "[DOWN]  Downloading current versions.json..."
          if aws s3 cp "s3://${S3_BUCKET}/downloads/versions.json" versions.json 2>/dev/null; then
            echo "[OK] Downloaded existing versions.json"
          else
            echo "[WARNING]  versions.json not found, creating new one"
            echo '{}' > versions.json
          fi
          
          echo "[NOTE] Updating versions.json..."
          
          # Update using jq (macOS has it pre-installed)
          jq --arg filename "$DMG_FILENAME" '.["macos-dmg"] = $filename' versions.json > versions.json.tmp
          mv versions.json.tmp versions.json
          
          echo "[OK] Updated versions.json:"
          cat versions.json
          
          echo "[UP]  Uploading updated versions.json..."
          aws s3 cp versions.json "s3://${S3_BUCKET}/downloads/versions.json" \
            --acl public-read \
            --content-type "application/json" \
            --metadata "last-updated=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          echo "[OK] versions.json updated successfully"
          echo "📍 Public URL: https://${S3_BUCKET}.s3.amazonaws.com/downloads/versions.json"

      - name: Upload stapled DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apuntador-macos-dmg-notarized-${{ inputs.release_tag }}
          path: ${{ env.DMG_PATH }}
          retention-days: 90

      - name: Summary
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "[SUCCESS] PROCESO COMPLETADO EXITOSAMENTE"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "[OK] DMG notarizado y con ticket grapado"
          echo "[OK] Subido a apuntador.io S3"
          echo "[OK] versions.json actualizado"
          echo ""
          echo "[PACKAGE] Archivo: $(basename ${{ env.DMG_PATH }})"
          echo "[LINK] URL público: https://${{ vars.APUNTADOR_IO_S3_BUCKET }}.s3.amazonaws.com/downloads/$(basename ${{ env.DMG_PATH }})"
          echo ""
          echo "Los usuarios ahora pueden descargar e instalar sin advertencias."
          echo "════════════════════════════════════════════════════════════════"
