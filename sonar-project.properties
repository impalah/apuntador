sonar.projectKey=impalah_apuntador
sonar.organization=impalah

# Project metadata
sonar.projectName=Apuntador
sonar.projectVersion=1.0

# Source directories (Vue/TypeScript code)
sonar.sources=src,public
sonar.tests=tests

# Exclude Android Java files (Capacitor native layer)
sonar.exclusions=android/**/*.java,android/**/*.kt,ios/**/*,node_modules/**/*,dist/**/*,build/**/*,.scannerwork/**/*

# Exclude .vue files from coverage analysis (tested via E2E, not unit tests)
sonar.coverage.exclusions=**/*.vue,src/app/**/*,src/pages/**/*,src/components/**/*,src/composables/**/*,src/plugins/**/*

# Language-specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding of the source code
sonar.sourceEncoding=UTF-8