sonar.projectKey=impalah_apuntador
sonar.organization=impalah

# Project metadata
sonar.projectName=Apuntador
sonar.projectVersion=1.0

# Source directories (Vue/TypeScript code)
sonar.sources=src,public
sonar.tests=tests

# Exclude Android Java files (Capacitor native layer)
sonar.exclusions=android/**/*.java,android/**/*.kt,ios/**/*,node_modules/**/*,dist/**/*,build/**/*,.scannerwork/**/*

# Exclude .vue files from coverage analysis (tested via E2E, not unit tests)
# Also exclude complex integration files that require extensive external API mocking
# Additional exclusions for platform-specific utilities that require hardware/browser APIs
sonar.coverage.exclusions=**/*.vue,src/app/**/*,src/pages/**/*,src/components/**/*,src/composables/**/*,src/plugins/**/*,src/stores/useCloudStore.ts,src/stores/useDropboxStore.ts,src/services/**/*,src/utils/serviceErrorHandler.ts,src/utils/webFullscreen.ts,src/utils/gamepad.ts,src/utils/gamepadManager.ts,src/utils/persistence.ts,src/utils/fullscreen.ts,src/utils/immersiveMode.ts,src/utils/capacitor.ts,src/utils/tauri.ts,src/utils/i18n.ts,src/utils/windowInsets.ts,src/utils/fileSync.ts,src/utils/fileSystem.ts

# Language-specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding of the source code
sonar.sourceEncoding=UTF-8