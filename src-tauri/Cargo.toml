[package]
name = "apuntador"
version = "0.1.24"
description = "Professional teleprompter for content creators"
authors = ["impalah"]
license = "MIT"
repository = "https://github.com/impalah/apuntador"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "apuntador_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
dotenvy = "0.15"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Tauri without devtools feature in production
# To enable devtools in development, build with: cargo build --features devtools
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2.10.1"
tauri-plugin-http = "2.8.3"
tauri-plugin-shell = "2.6.0"
tauri-plugin-opener = "2.7.2"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.13", features = [
    "json",
    "form",
    "query",
    "rustls",
], default-features = false }
url = "2.4"
base64 = "0.23"
sha2 = "0.10"
rand = "0.10"
urlencoding = "2.1"
uuid = { version = "1.0", features = ["v4"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# mTLS and certificate handling
rustls = "0.23"
rcgen = "0.14"
chrono = "0.4"
hex = "0.4"
dirs = "7.0"

# Platform-specific secure storage
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

# Features configuration
# Default: no devtools (production mode)
[features]
default = []
# Enable devtools for development: cargo tauri dev --features devtools
devtools = ["tauri/devtools"]
